lexicon:
  categories:
    code path:
      - \b(src|tests|tools|libs|services)/\S+\.(py|yaml|json|ts|js)\b
      - "::"
    CLI flag:
      - (?<![\w-])--[a-z][a-z0-9-]*
    exit code / HTTP status:
      - \bexit\s*(code\s*)?\d
      - \bHTTP\s*\d{3}
      - (?<![\d,.])\b(422|500)\b(?![\d,.])
    request/response model name:
      - \b[A-Z][A-Za-z]+(Request|Response)\b
  allowedTerms:
    - ConfigError
    - ValidationError
    - InputFormatError
