name: Android mobile

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android-mobile/**'
      - '.github/workflows/android-mobile.yml'
  pull_request:
    paths:
      - 'android-mobile/**'
      - '.github/workflows/android-mobile.yml'

permissions:
  contents: read

concurrency:
  group: android-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-apk:
    name: clean ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: android-mobile
    env:
      npm_config_cache: ${{ github.workspace }}/android-mobile/.tools/npm-cache
      COREPACK_HOME: ${{ github.workspace }}/android-mobile/.tools/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/android-mobile/.tools/xdg-cache
      PNPM_CONFIG_STORE_DIR: ${{ github.workspace }}/android-mobile/.tools/pnpm-store
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.19.0'

      - name: Prepare system tools and pinned Node headers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential dpkg-dev curl unzip xz-utils
          mkdir -p .tools/downloads .tools/node22
          curl -fL --retry 3 https://nodejs.org/dist/v22.19.0/SHASUMS256.txt -o .tools/downloads/node-SHASUMS256.txt
          curl -fL --retry 3 https://nodejs.org/dist/v22.19.0/node-v22.19.0-linux-x64.tar.xz -o .tools/downloads/node-v22.19.0-linux-x64.tar.xz
          (cd .tools/downloads && awk '$2 == "node-v22.19.0-linux-x64.tar.xz"' node-SHASUMS256.txt | sha256sum -c -)
          tar -xJf .tools/downloads/node-v22.19.0-linux-x64.tar.xz --strip-components=1 -C .tools/node22

      - name: Prepare this checkout's Android toolchain
        run: |
          unset JAVA_HOME ANDROID_HOME ANDROID_SDK_ROOT
          python3 scripts/bootstrap-android-host.py --install --accept-licenses

      - name: Audit sources and check build orchestration
        run: |
          python3 scripts/audit-repository.py
          python3 scripts/test-build-master-apk.py
          python3 scripts/test-master-client-build.py

      - name: Build runtime, run JVM tests, and verify APK
        run: |
          unset JAVA_HOME ANDROID_HOME ANDROID_SDK_ROOT
          source scripts/env.sh
          python3 scripts/build-master-apk.py

      - name: Record validation scope
        if: always()
        run: |
          echo 'This job builds from public inputs and verifies the packaged APK. It does not install on a device or validate live accounts, voice models, or system permissions.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android-mobile-arm64-${{ github.sha }}
          path: |
            android-mobile/artifacts/deepcode-source-arm64.apk
            android-mobile/artifacts/first-build.json
          if-no-files-found: error
          retention-days: 7
