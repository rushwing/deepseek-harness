# Local endpoint and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  config:
    baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
    thinking: enabled
    reasoningEffort: low
    # This assembled CLI test shares a hosted runner with other worker processes.
    # A 150 ms wall-clock deadline can retry a healthy loopback response when the
    # child is descheduled. The provider stream unit tests verify that comments
    # count as transport activity; this fixture verifies composition and defaults.
    streamIdleTimeoutMs: 5000

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
